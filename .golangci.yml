version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - errname
    - errorlint
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    dupl:
      threshold: 200
    errcheck:
      check-blank: true
    nolintlint:
      require-explanation: true
      require-specific: true
    gocritic:
      disabled-checks:
        - octalLiteral
        - ifElseChain
      enabled-tags:
        - performance
        - style
    gocyclo:
      min-complexity: 8
    lll:
      line-length: 140
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gocritic
          - gocyclo
          - lll
          - unused
        path: _test\.go
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
